name = "nfc-0x0krr-api"
main = "worker.js"
compatibility_date = "2026-10-01"
workers_dev = true

[vars]
ALLOWED_ORIGIN = "https://nskge.github.io"
EXPECTED_HOSTNAME = "nskge.github.io"
TURNSTILE_SITE_KEY = "REPLACE_WITH_PUBLIC_TURNSTILE_SITE_KEY"

[[d1_databases]]
binding = "DB"
database_name = "nfc-0x0krr"
database_id = "REPLACE_WITH_D1_DATABASE_ID"

[triggers]
crons = ["0 5 * * *"]